<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1080px; height: 1080px; overflow: hidden; font-family: -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", sans-serif; background: linear-gradient(135deg, #5ec2de 0%, #5b95de 55%, #8f8ad6 100%); position: relative; letter-spacing: -0.01em; }
#phone { position: absolute; left: 126px; top: 40px; width: 414px; height: 900px; transform-origin: 0 0; transform: scale(2); border-radius: 62px; background: #1b1b1d; padding: 12px; box-shadow: 0 0 0 2px #3a3a3d inset, 0 30px 60px rgba(0,0,0,.35); }
#screen { position: relative; width: 390px; height: 876px; border-radius: 50px; overflow: hidden; background: #8fc3b0; }
#island { position: absolute; left: 145px; top: 11px; width: 100px; height: 30px; border-radius: 15px; background: #000; z-index: 90; }
#status { position: absolute; top: 16px; left: 36px; font-size: 15px; font-weight: 600; z-index: 80; color: #000; }
#statusR { position: absolute; top: 18px; right: 30px; z-index: 80; display: flex; gap: 5px; align-items: center; }
#wall { position: absolute; inset: 0; background: linear-gradient(160deg, #a7d9ea 0%, #a3d5c4 55%, #b3d99a 100%); }
#wall svg { position: absolute; inset: 0; opacity: .35; }
#msgs { position: absolute; left: 0; right: 0; top: 0; height: 876px; }
.bubble { position: absolute; max-width: 270px; padding: 7px 12px 6px; border-radius: 19px; font-size: 17px; line-height: 22px; color: #000; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
.in { background: #fff; left: 9px; border-bottom-left-radius: 6px; }
.out { background: #e1ffc7; right: 9px; border-bottom-right-radius: 6px; }
.in:before, .out:before { content: ""; position: absolute; bottom: 0; width: 12px; height: 14px; }
.in:before { left: -5px; background: radial-gradient(circle at 0 0, transparent 11px, #fff 11.5px); border-bottom-right-radius: 0; clip-path: polygon(0 100%, 100% 0, 100% 100%); background: #fff; clip-path: path("M12 0 L12 14 L0 14 C6 14 11 8 12 0 Z"); }
.out:before { right: -5px; background: #e1ffc7; clip-path: path("M0 0 L0 14 L12 14 C6 14 1 8 0 0 Z"); }
.bubble .t { float: right; margin: 6px 0 0 10px; font-size: 12px; line-height: 14px; color: #77828c; }
.out .t { color: #5ea35a; }
.bubble .photo { width: 240px; height: 240px; margin: -4px -9px 6px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 120px; }
.photoB { padding: 3px 3px 6px; }
.photoB .cap { padding: 0 9px; }
.glass { background: rgba(244,244,246,.78); backdrop-filter: blur(10px); box-shadow: 0 1px 6px rgba(0,0,0,.12), inset 0 0 0 .5px rgba(255,255,255,.8); }
#nav { position: absolute; top: 0; left: 0; right: 0; height: 120px; z-index: 10; }
#nav .circle { position: absolute; top: 58px; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; }
#nav .pill { position: absolute; top: 58px; left: 122px; width: 146px; height: 44px; border-radius: 22px; text-align: center; font-weight: 600; font-size: 16px; padding-top: 5px; line-height: 19px; }
#nav .pill small { display: block; font-weight: 400; font-size: 13px; color: #0088ff; }
#nav .av { position: absolute; right: 16px; top: 58px; width: 44px; height: 44px; border-radius: 22px; background: linear-gradient(135deg,#f6b26b,#e67e5b); text-align: center; line-height: 44px; font-size: 24px; }
#nav .back { left: 14px; }
#nav .srch { right: 68px; }
#composer { position: absolute; left: 0; right: 0; bottom: 0; height: 90px; }
#dim { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 20; }
#sheet { position: absolute; left: 0; right: 0; top: 96px; bottom: 0; border-radius: 38px 38px 0 0; background: #f4f4f7; z-index: 30; overflow: hidden; box-shadow: 0 -4px 30px rgba(0,0,0,.18); }
#grab { position: absolute; left: 175px; top: 6px; width: 40px; height: 5px; border-radius: 3px; background: #c4c4c9; }
#sheetHead { position: absolute; top: 14px; left: 0; right: 0; height: 44px; text-align: center; font-weight: 600; font-size: 17px; line-height: 44px; }
#sheetHead .x { position: absolute; left: 12px; top: 0; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: #fff; }
#sbar { position: absolute; left: 12px; right: 12px; top: 70px; height: 44px; border-radius: 22px; background: rgba(118,118,128,.12); padding: 0 14px; font-size: 17px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
#sbar .ph { color: #8e8d92; }
#sbar .ai { margin-left: auto; font-size: 12px; font-weight: 600; color: #fff; background: linear-gradient(90deg, #0088ff, #8f5de5); padding: 4px 9px; border-radius: 12px; display: flex; gap: 4px; align-items: center; }
#caret { display: inline-block; width: 2px; height: 22px; background: #0088ff; vertical-align: middle; margin-left: 1px; }
#seg { position: absolute; left: 12px; right: 12px; top: 124px; height: 36px; border-radius: 18px; background: rgba(0,0,0,.06); display: flex; padding: 3px; }
#seg div { flex: 1; text-align: center; font-size: 14px; font-weight: 500; line-height: 30px; border-radius: 15px; }
#seg .on { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.14); font-weight: 600; }
#info { position: absolute; left: 14px; right: 14px; top: 170px; height: 20px; font-size: 13px; color: #8e8e93; }
#gridWrap { position: absolute; left: 0; right: 0; top: 196px; bottom: 0; overflow: hidden; }
.tile { position: absolute; width: 96.5px; height: 96.5px; display: flex; align-items: center; justify-content: center; font-size: 48px; overflow: hidden; will-change: transform; }
.tile .vid { position: absolute; right: 4px; top: 4px; font-size: 11px; font-weight: 600; color: #fff; background: rgba(0,0,0,.45); border-radius: 8px; padding: 1px 6px; }
#skel { position: absolute; left: 0; right: 0; top: 196px; bottom: 0; background: #f4f4f7; }
#skel .sk { position: absolute; background: #e3e3e8; overflow: hidden; }
#skel .sk:after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.9) 50%, transparent 80%); transform: translateX(var(--sx, -100%)); }
#scan { position: absolute; left: 0; right: 0; top: 196px; height: 3px; background: linear-gradient(90deg, transparent, #0088ff, #8f5de5, transparent); }
#sparkle { position: absolute; left: 0; right: 0; top: 170px; text-align: center; font-size: 13px; font-weight: 600; color: #0088ff; }
#viewer { position: absolute; inset: 0; background: #000; z-index: 45; opacity: 0; }
#viewerImg { position: absolute; display: flex; align-items: center; justify-content: center; }
#vbar { position: absolute; left: 0; right: 0; top: 0; height: 110px; background: rgba(20,20,20,.8); z-index: 2; }
#vbar .ttl { position: absolute; left: 0; right: 0; top: 56px; text-align: center; color: #fff; font-weight: 600; font-size: 16px; line-height: 18px; }
#vbar .ttl small { display: block; font-weight: 400; font-size: 12px; opacity: .6; }
#vbar .done { position: absolute; left: 16px; top: 62px; color: #0088ff; font-size: 17px; }
#vact { position: absolute; left: 0; right: 0; top: 440px; height: 80px; background: rgba(20,20,20,.8); display: flex; justify-content: space-between; padding: 14px 28px 0; }
#vact .b { width: 44px; height: 44px; border-radius: 22px; background: #0088ff; display: flex; align-items: center; justify-content: center; }
#vact .b.g { background: rgba(255,255,255,.14); }
</style>
</head>
<body>
<div id="phone"><div id="screen">
  <div id="island"></div><div id="status">9:41</div>
  <div id="statusR">
    <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#000" opacity=".4"/><rect x="2" y="2" width="19" height="9" rx="2.2"/><rect x="24" y="4.5" width="1.6" height="4" rx=".8" opacity=".4"/></svg>
  </div>
  <div id="wall"><svg width="390" height="876"><defs><pattern id="p" width="60" height="60" patternUnits="userSpaceOnUse"><circle cx="10" cy="12" r="3" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M34 10 l8 8 m0 -8 l-8 8" stroke="#fff" stroke-width="1.5"/><path d="M12 40 q8 -10 16 0" fill="none" stroke="#fff" stroke-width="1.5"/><rect x="40" y="40" width="10" height="10" rx="3" fill="none" stroke="#fff" stroke-width="1.5"/></pattern></defs><rect width="390" height="876" fill="url(#p)"/></svg></div>
  <div id="msgs"></div>
  <div id="nav">
    <div class="circle glass back"><svg width="12" height="20" viewBox="0 0 12 20"><path d="M10 2 L2 10 L10 18" fill="none" stroke="#0088ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="pill glass">Semyon<small>online</small></div>
    <div class="circle glass srch" id="searchBtn"><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="6" fill="none" stroke="#0088ff" stroke-width="2.2"/><path d="M13 13 L18 18" stroke="#0088ff" stroke-width="2.2" stroke-linecap="round"/></svg></div>
    <div class="av">🧑‍🦰</div>
  </div>
  <div id="dim"></div>
  <div id="sheet">
    <div id="grab"></div>
    <div id="sheetHead"><div class="x"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 2 L14 14 M14 2 L2 14" stroke="#000" stroke-width="2.2" stroke-linecap="round"/></svg></div>Search in Chat</div>
    <div id="sbar"><svg width="18" height="18" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="6" fill="none" stroke="#8e8d92" stroke-width="2.2"/><path d="M13 13 L18 18" stroke="#8e8d92" stroke-width="2.2" stroke-linecap="round"/></svg><span id="q"></span><span id="caretWrap"><span id="caret"></span></span><span class="ph" id="ph">Search media</span><span class="ai"><svg width="11" height="11" viewBox="0 0 24 24"><path d="M12 0 C13 8 16 11 24 12 C16 13 13 16 12 24 C11 16 8 13 0 12 C8 11 11 8 12 0Z" fill="#fff"/></svg>AI</span></div>
    <div id="seg"><div class="on">All</div><div>Photos</div><div>Videos</div></div>
    <div id="info"></div>
    <div id="gridWrap"></div>
    <div id="skel"></div>
    <div id="scan"></div>
    <div id="sparkle"></div>
  </div>
  <div id="viewer">
    <div id="vbar"><div class="done">Done</div><div class="ttl">Semyon's dog<small>14 March 2024 at 18:22</small></div></div>
    <div id="viewerImg"></div>
    <div id="vact"><div class="b g"><svg width="20" height="22" viewBox="0 0 20 22"><path d="M10 14 V2 M5 7 L10 2 L15 7 M2 11 V19 H18 V11" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="b" id="send"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M11 18 V4 M4 10 L11 3 L18 10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
  </div>
</div></div>

<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const bez = (x1, y1, x2, y2) => p => {
  p = clamp(p);
  let lo = 0, hi = 1, s = p;
  for (let i = 0; i < 30; i++) { s = (lo + hi) / 2; const x = 3 * (1 - s) * (1 - s) * s * x1 + 3 * (1 - s) * s * s * x2 + s * s * s; if (x < p) lo = s; else hi = s; }
  return 3 * (1 - s) * (1 - s) * s * y1 + 3 * (1 - s) * s * s * y2 + s * s * s;
};
const sys = bez(0.23, 1.0, 0.32, 1.0);
const inout = bez(0.42, 0, 0.58, 1);
const lerp = (a, b, p) => a + (b - a) * p;
const $ = id => document.getElementById(id);

const grads = [["#f6d365", "#fda085"], ["#a1c4fd", "#c2e9fb"], ["#d4fc79", "#96e6a1"], ["#fbc2eb", "#a6c1ee"], ["#ffecd2", "#fcb69f"], ["#84fab0", "#8fd3f4"], ["#e0c3fc", "#8ec5fc"], ["#fddb92", "#d1fdff"]];
const others = ["🏔️", "🍕", "🌅", "🚗", "☕", "🎂", "🌳", "🏖️", "📄", "🍣", "🎸", "🏙️", "🐱", "🌸", "🧳", "🎮", "🚲", "🍔", "⛵", "📚", "🐦", "🛋️", "🎄", "🧁", "🐴"];
const dogs = ["🐕", "🐶", "🐩", "🦮", "🐕‍🦺", "🐶"];
const N = 72, dogIdx = [3, 9, 14, 22, 31, 47];
const tiles = [];
for (let i = 0; i < N; i++) {
  const d = dogIdx.indexOf(i), g = grads[(i * 5 + 3) % grads.length];
  tiles.push({ i, dog: d >= 0, rank: d, emoji: d >= 0 ? dogs[d] : others[(i * 7 + 2) % others.length], g, vid: i % 11 === 4 });
}
const grid = $("gridWrap");
tiles.forEach(t => {
  const e = document.createElement("div");
  e.className = "tile";
  e.style.background = `linear-gradient(135deg, ${t.g[0]}, ${t.g[1]})`;
  e.innerHTML = t.emoji + (t.vid ? '<span class="vid">0:12</span>' : "");
  grid.appendChild(e); t.el = e;
});
const skel = $("skel");
for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
  const s = document.createElement("div"); s.className = "sk";
  s.style.cssText = `left:${c * 97.5}px;top:${r * 97.5}px;width:96.5px;height:96.5px`;
  skel.appendChild(s);
}

const QUERY = "Semyon's dog";
const G = 97.5;
const cellPos = n => ({ x: (n % 4) * G, y: Math.floor(n / 4) * G });

const bubbles = [
  { side: "in", y: 130, text: "Hey! We're finally adopting a puppy 🥳", time: "14:02", at: -10 },
  { side: "out", y: 192, text: "No way, congrats!!", time: "14:03 ✓✓", at: -10 },
  { side: "in", y: 254, text: "Remember my dog I showed to you a while ago? Send me that photo, I can't find it 😅", time: "14:05", at: 0.6 },
];
const msgs = $("msgs");
bubbles.forEach(b => {
  const e = document.createElement("div");
  e.className = "bubble " + b.side;
  e.innerHTML = b.text + `<span class="t">${b.time}</span>`;
  msgs.appendChild(e); b.el = e;
});
const photoBubble = document.createElement("div");
photoBubble.className = "bubble out photoB";
photoBubble.innerHTML = '<div class="photo" style="background:linear-gradient(135deg,#f6d365,#fda085);margin:0 0 4px">🐕</div><div class="cap">Here he is! <span class="t">14:06 ✓✓</span></div>';
msgs.appendChild(photoBubble);

function setBubble(el, y, p) {
  el.style.top = y + "px";
  el.style.opacity = clamp(p * 3);
  el.style.transform = `translateY(${(1 - p) * 40}px) scale(${0.9 + 0.1 * p})`;
}

function render(t) {
  const lift = -sys(seg(t, 13.1, 13.9)) * 232;
  msgs.style.transform = `translateY(${lift}px)`;
  bubbles.forEach(b => setBubble(b.el, b.y, b.at < 0 ? 1 : sys(seg(t, b.at, b.at + 0.6))));
  setBubble(photoBubble, 314, t >= 13.1 ? sys(seg(t, 13.1, 13.9)) : 0);
  photoBubble.style.display = t >= 13.0 ? "block" : "none";

  const sheetP = sys(seg(t, 2.7, 3.4)) - inout(seg(t, 12.6, 13.2));
  $("sheet").style.transform = `translateY(${(1 - sheetP) * 800}px)`;
  $("dim").style.opacity = sheetP * 0.35;

  const typed = Math.floor(seg(t, 4.3, 5.9) * QUERY.length + 0.0001);
  $("q").textContent = QUERY.slice(0, typed);
  $("ph").style.display = t > 4.2 ? "none" : "inline";
  $("caretWrap").style.display = t > 3.6 && t < 8.0 && (Math.floor(t * 2.5) % 2 === 0 || (t > 4.3 && t < 6.0)) ? "inline" : "none";

  let scroll = 0;
  if (t >= 3.4 && t < 4.3) scroll = sys(seg(t, 3.4, 4.3)) * 520;
  if (t >= 4.3) scroll = 520 * (1 - inout(seg(t, 4.3, 5.4)));
  const blur = t >= 3.4 && t < 4.6 ? Math.max(0, 1 - Math.abs(seg(t, 3.4, 4.6) - 0.2) * 1.2) * 2.5 : 0;

  const fade = seg(t, 8.2, 9.0);
  const resultsPos = sys(seg(t, 8.4, 9.5));
  const skelAmt = seg(t, 6.4, 6.7) - seg(t, 8.0, 8.2);
  tiles.forEach(tl => {
    const base = cellPos(tl.i), fin = cellPos(tl.dog ? tl.rank : tl.i);
    let x = base.x, y = base.y - scroll, o = 1, s = 1;
    if (tl.dog) {
      x = lerp(base.x, fin.x, resultsPos);
      y = lerp(base.y - scroll, fin.y, resultsPos);
      if (t >= 7.6 && t < 8.6) s = 1 + 0.06 * Math.sin(seg(t, 7.6, 8.6) * Math.PI);
    } else { o = 1 - sys(fade); s = 1 - 0.25 * sys(fade); }
    const el = tl.el;
    el.style.transform = `translate(${x}px,${y}px) scale(${s})`;
    el.style.opacity = o * (1 - clamp(skelAmt));
    el.style.filter = blur ? `blur(${blur}px)` : "none";
  });

  skel.style.opacity = clamp(skelAmt);
  skel.style.display = skelAmt > 0 ? "block" : "none";
  skel.style.setProperty("--sx", (((t * 1.1) % 1) * 300 - 100) + "%");
  const scan = $("scan");
  scan.style.opacity = clamp(skelAmt);
  scan.style.transform = `translateY(${((t * 1.4) % 1) * 300}px)`;
  const sp = $("sparkle");
  sp.style.display = skelAmt > 0 ? "block" : "none";
  sp.style.opacity = clamp(skelAmt);
  sp.textContent = "✦ Understanding “" + QUERY + "”…";

  const info = $("info");
  if (t < 6.4) info.textContent = t < 4.3 ? "4,812 photos and videos" : "Searching 4,812 photos and videos";
  else if (t >= 8.2) info.innerHTML = '<b style="color:#000">6 results</b> · dog · Semyon';
  info.style.opacity = t >= 6.4 && t < 8.2 ? 0 : 1;

  const vP = sys(seg(t, 10.4, 11.1)) - inout(seg(t, 12.2, 12.6));
  const viewer = $("viewer");
  viewer.style.opacity = clamp(vP * 3);
  $("vbar").style.opacity = clamp((vP - 0.6) * 2.5);
  $("vact").style.opacity = clamp((vP - 0.6) * 2.5);
  const vi = $("viewerImg"), fp = clamp(vP), first = cellPos(0), sy = 96 + 196;
  const g = grads[(3 * 5 + 3) % grads.length];
  vi.style.left = lerp(first.x, 0, fp) + "px";
  vi.style.top = lerp(first.y + sy, 110, fp) + "px";
  vi.style.width = lerp(96.5, 390, fp) + "px";
  vi.style.height = lerp(96.5, 330, fp) + "px";
  vi.style.fontSize = lerp(48, 170, fp) + "px";
  vi.style.background = `linear-gradient(135deg, ${g[0]}, ${g[1]})`;
  vi.textContent = "🐕";
  $("send").style.transform = t > 12.05 && t < 12.3 ? "scale(.9)" : "scale(1)";

  $("searchBtn").style.background = t > 2.2 && t < 2.8 ? "rgba(0,136,255,.25)" : "rgba(244,244,246,.78)";
}
window.render = render;
render(0);
</script>
</body>
</html>
