<html>
<head>
<meta charset="utf-8">
<style>

* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1080px; height: 1080px; overflow: hidden; background: linear-gradient(135deg, #5ec2de 0%, #5b95de 55%, #8f8ad6 100%); font-family: "Inter", sans-serif; letter-spacing: -0.43px; }

/* chat */

#wall { position: absolute; inset: 0; background:
  radial-gradient(70% 45% at 8% 10%, #cddba2 0, rgba(205,219,162,0) 100%),

  radial-gradient(70% 40% at 100% 100%, #a1c37f 0, rgba(161,195,127,0) 100%),

  #8dc58b; }
#wallPat { position: absolute; left: -52px; top: 0; width: 507px; height: 873px; opacity: .13; }
#chatTop { position: absolute; left: 0; right: 0; top: 0; height: 116px; background: linear-gradient(rgba(255,255,255,.28), rgba(255,255,255,0)); z-index: 5; }
#msgs { position: absolute; left: 0; right: 0; bottom: 74px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 8px 0; z-index: 2; }
.mw { position: relative; flex: none; }
.mi { position: relative; }
.row { display: flex; padding: 2px 0; }
.row.out { justify-content: flex-end; padding-left: 24px; }
.row.in { padding-right: 24px; }
.bub { position: relative; border-radius: 18px; padding: 4px 8px; max-width: 288px; font-size: 17px; line-height: 22px; color: #000; }
.in .bub { background: #fff; } .out .bub { background: #e8fdd6; }
.bub .pad { display: inline-block; height: 1px; }
.bub .time { position: absolute; right: 12px; bottom: 4px; display: flex; gap: 3px; align-items: center; font-size: 11px; line-height: 12px; letter-spacing: 0; }
.in .time { color: #a4a4a4; right: 10px; } .out .time { color: #55b84b; }
.tail { position: absolute; bottom: 0; width: 13.62px; height: 32px; }
.in .tail { left: -5.6px; color: #fff; } .out .tail { right: -5.6px; color: #e8fdd6; transform: scaleX(-1); }
.svc { display: table; margin: 8px auto; padding: 3px 7px; border-radius: 12px; font-size: 13px; font-weight: 600; line-height: 18px; color: #fff; background: rgba(60,80,48,.42); backdrop-filter: blur(20px); letter-spacing: -.08px; }
.unread { margin: 4px -8px; height: 33px; background: rgba(255,255,255,.72); text-align: center; line-height: 33px; font-size: 15px; color: #8a8a8e; letter-spacing: -.2px; }
.chip { display: flex; width: fit-content; align-items: center; gap: 4px; margin-top: 4px; height: 32px; padding: 0 6px; border-radius: 16px; background: #0a84ff; }
.chip .av { width: 24px; height: 24px; border-radius: 12px; background: linear-gradient(135deg, #d7e6f4, #7ba3c9); }
.media { padding: 1px; border-radius: 18px; }
.media .ph { border-radius: 17px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
.media .tchip { position: absolute; right: 8px; bottom: 6px; padding: 3px 7px; border-radius: 9px; background: rgba(0,0,0,.3); backdrop-filter: blur(12px); color: #fff; font-size: 11px; line-height: 12px; display: flex; gap: 3px; letter-spacing: 0; }
#composer { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; padding: 4px 28px 28px; display: flex; gap: 6px; align-items: flex-end; z-index: 6; }

#navChat .pill { position: absolute; top: 62px; left: 50%; transform: translateX(-50%); height: 44px; border-radius: 22px; padding: 6px 16px; text-align: center; white-space: nowrap; }
.pill .t1 { font-size: 15px; font-weight: 600; line-height: 18px; color: #333; letter-spacing: -.23px; }
.pill .t2 { font-size: 12px; font-weight: 500; line-height: 14px; color: #999; letter-spacing: 0; }
.avs { position: absolute; top: 62px; right: 16px; width: 44px; height: 44px; border-radius: 22px; padding: 3px; }
.avs div { width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(135deg, #f0d2bd, #a46f55); display: flex; align-items: center; justify-content: center; }

#pSub { position: absolute; left: 0; right: 0; top: 224px; display: flex; justify-content: center; gap: 4px; align-items: center; font-size: 15px; font-weight: 500; line-height: 20px; color: #999; letter-spacing: -.25px; }
#pBtns { position: absolute; left: 16px; right: 16px; top: 282px; display: flex; gap: 8px; }
#pBtns .b { flex: 1; height: 60px; border-radius: 24px; background: rgba(255,255,255,.88); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #008bff; font-size: 12px; line-height: 16px; letter-spacing: 0; }
#pCard { position: absolute; left: 16px; right: 16px; top: 373px; height: 140px; border-radius: 26px; background: #fff; }
#pCard .l { position: absolute; left: 16px; font-size: 15px; line-height: 20px; color: #000; letter-spacing: -.2px; }
#pCard .v { position: absolute; left: 16px; font-size: 17px; line-height: 22px; color: #3a8ae5; }
#pCard .sep { position: absolute; left: 16px; right: 0; top: 70px; height: .5px; background: rgba(60,60,67,.2); }
#pPill { position: absolute; top: 531px; height: 40px; border-radius: 20px; padding: 4px; display: flex; overflow: hidden; white-space: nowrap; z-index: 6; }
#pPill .sel { position: absolute; top: 4px; height: 32px; border-radius: 16px; background: rgba(60,60,67,.12); }
#pPill .it { position: relative; flex: none; height: 32px; padding: 0 16px; line-height: 32px; font-size: 17px; font-weight: 500; color: #000; letter-spacing: -.3px; }
#pGift { position: absolute; left: 16px; right: 16px; top: 587px; height: 116px; border-radius: 26px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 64px; }
#pGift i { position: absolute; left: 8px; top: 8px; width: 22px; height: 22px; border-radius: 11px; background: #5aa9f0; }
#pSearch { position: absolute; left: 16px; right: 16px; height: 36px; border-radius: 18px; background: rgba(118,118,128,.12); display: flex; align-items: center; gap: 9px; padding: 0 14px; font-size: 17px; color: #999; overflow: hidden; white-space: nowrap; z-index: 5; }
#pSearch .txt { color: #000; }
#pSearch .caret { width: 2px; height: 20px; background: #008bff; margin-left: -8px; }
#pSearch .ai { margin-left: auto; display: flex; align-items: center; gap: 4px; color: #008bff; font-size: 13px; font-weight: 600; }
#pTop { position: absolute; left: 0; right: 0; top: 0; height: 122px; background: linear-gradient(#f0eff4 82%, rgba(240,239,244,0)); z-index: 7; opacity: 0; }
#pPill { z-index: 8 !important; }
#pGrid { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 26px 26px 0 0; overflow: hidden; background: #f0eff4; z-index: 4; }
.tile { position: absolute; width: 132.67px; height: 132.67px; display: flex; align-items: center; justify-content: center; font-size: 64px; overflow: hidden; will-change: transform; }
#skel { position: absolute; inset: 0; background: #f0eff4; }
#skel .sk { position: absolute; width: 132.67px; height: 132.67px; background: #e1e1e6; overflow: hidden; }
#skel .sk:after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.85) 50%, transparent 80%); transform: translateX(var(--sx, -100%)); }
#navP { z-index: 9; position: absolute; inset: 0; pointer-events: none; }
#navP .tp { position: absolute; top: 62px; left: 50%; transform: translateX(-50%); height: 44px; border-radius: 22px; padding: 6px 16px; text-align: center; white-space: nowrap; }
#navP .ed { position: absolute; top: 62px; right: 16px; height: 44px; border-radius: 22px; padding: 0 14px; display: flex; align-items: center; font-size: 17px; font-weight: 500; color: #1a1a1a; letter-spacing: 0; }

/* viewer */
#viewer { background: #000; opacity: 0; }
#vImg { position: absolute; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#viewer .c44 { background: rgba(60,60,60,.7); color: #fff; box-shadow: none; }
#touch { position: absolute; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; background: rgba(40,40,40,.22); border: 1.5px solid rgba(255,255,255,.55); z-index: 180; opacity: 0; pointer-events: none; }
</style>
</head>

</div><img id="bezel" src="assets/bezel.png"></div>
<script src="assets.js"></script>
<script>
const A = ASSETS;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const bez = (x1, y1, x2, y2) => p => {
  p = clamp(p); let lo = 0, hi = 1, s = p;
  for (let i = 0; i < 32; i++) { s = (lo + hi) / 2; const x = 3 * (1 - s) ** 2 * s * x1 + 3 * (1 - s) * s * s * x2 + s ** 3; if (x < p) lo = s; else hi = s; }
  return 3 * (1 - s) ** 2 * s * y1 + 3 * (1 - s) * s * s * y2 + s ** 3;
};
const sys = bez(0.23, 1, 0.32, 1), io = bez(0.42, 0, 0.58, 1);
const lerp = (a, b, p) => a + (b - a) * p;
const $ = id => document.getElementById(id);
const sized = (svg, w, h) => svg.replace(/width="[^"]*"/, `width="${w}"`).replace(/height="[^"]*"/, `height="${h}"`);
const iconH = (svg, h) => { const m = svg.match(/viewBox="[\d. -]+ ([\d.]+) ([\d.]+)"/); return sized(svg, h * m[1] / m[2], h); };
const stroke = (inner, s = 24) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const I = {
  search: s => stroke('<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20.5 20.5"/>', s),
  xmark: s => stroke('<path d="M5 5L19 19M19 5L5 19"/>', s),
  phone: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>`,
  video: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="6" width="14" height="12" rx="3.5"/><path d="M17.5 10.5L22 7.8v8.4l-4.5-2.7z"/></svg>`,
  bell: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c-3.3 0-5.8 2.5-5.8 5.8v3.3c0 .8-.3 1.5-.8 2.1L4 15.3c-.5.7 0 1.7.9 1.7h14.2c.9 0 1.4-1 .9-1.7l-1.4-1.6c-.5-.6-.8-1.3-.8-2.1V8.3c0-3.3-2.5-5.8-5.8-5.8zM9.7 18.5a2.4 2.4 0 004.6 0z"/></svg>`,
  more: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><circle cx="4.5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19.5" cy="12" r="2.2"/></svg>`,
  qr: s => stroke('<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="M14 14h3M20 14v0M14 18v3M18 18h3M21 21v0"/>', s),
  sparkle: s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1c1 7 4 10 11 11-7 1-10 4-11 11-1-7-4-10-11-11C8 11 11 8 12 1z"/></svg>`,
  share: s => stroke('<path d="M12 15V3M7.5 7.5L12 3l4.5 4.5M5 11v8a2 2 0 002 2h10a2 2 0 002-2v-8"/>', s),
  check2: `<svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6l3 3 6-7M6 8.5l1 .5 6-7.5"/></svg>`,
  shield: `<svg width="17" height="19" viewBox="0 0 17 19"><path d="M8.5 0L16 2.5v6.2c0 4.4-3 8.4-7.5 10.3C4 17.100 1 13.100 1 8.700V2.500z" fill="#2f7be0"/><text x="8.5" y="12.500" font-size="10" font-weight="700" fill="#fff" text-anchor="middle" font-family="Inter" letter-spacing="0">1</text></svg>`,
  heart: `<svg width="18" height="16" viewBox="0 0 24 22"><path d="M12 21C-6 9 4-2 12 5c8-7 18 4 0 16z" fill="#ff3b30"/></svg>`,
};

$("lv").innerHTML = A.cell + A.wifi + A.battery;
$("backC").innerHTML = iconH(A.back, 19);
$("backP").innerHTML = iconH(A.back, 19);
$("clip").innerHTML = iconH(A.paperclip, 24);

const btnDefs = [["call", I.phone], ["video", I.video], ["mute", I.bell], ["search", I.search], ["more", I.more]];
$("pBtns").innerHTML = btnDefs.map(([l, f]) => `<div class="b">${f(26)}<span>${l}</span></div>`).join("");

const grads = [["#f6d365", "#fda085"], ["#a1c4fd", "#c2e9fb"], ["#d4fc79", "#96e6a1"], ["#fbc2eb", "#a6c1ee"], ["#ffecd2", "#fcb69f"], ["#84fab0", "#8fd3f4"], ["#e0c3fc", "#8ec5fc"], ["#fddb92", "#d1fdff"]];
const others = ["🏔️", "🍕", "🌅", "🚗", "☕", "🎂", "🌳", "🏖️", "📄", "🍣", "🎸", "🏙️", "🐱", "🌸", "🧳", "🎮", "🚲", "🍔", "⛵", "📚", "🐦", "🛋️", "🎄", "🧁", "🐴"];
const dogs = ["🐕", "🐶", "🐩", "🦮", "🐕‍🦺", "🐶"];
const N = 90, dogIdx = [2, 7, 13, 19, 26, 40];
const tiles = [];
for (let i = 0; i < N; i++) {
  const d = dogIdx.indexOf(i), g = grads[(i * 5 + 3) % grads.length];
  tiles.push({ i, dog: d >= 0, rank: d, emoji: d >= 0 ? dogs[d] : others[(i * 7 + 2) % others.length], g });
}
const gridIn = $("gridIn");
tiles.forEach(t => {
  const e = document.createElement("div"); e.className = "tile";
  e.style.background = `linear-gradient(135deg, ${t.g[0]}, ${t.g[1]})`;

for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) {
  const s = document.createElement("div"); s.className = "sk";
  s.style.cssText = `left:${c * 134.67}px;top:${r * 134.67}px`; skel.appendChild(s);
}
const G = 134.67;
const cellPos = n => ({ x: (n % 3) * G, y: Math.floor(n / 3) * G });

const pill = $("pPill");
const labels = ["Gifts 🧸", "Media", "Files", "Links", "Music", "Voice"];
labels.forEach(l => { const e = document.createElement("div"); e.className = "it"; e.textContent = l; pill.appendChild(e); });
const pits = [...pill.querySelectorAll(".it")];
const itX = [];

const msgs = $("msgs");
const ticks = `<span class="time"><span>4:44 PM</span>${I.check2}</span>`;
function mk(html, appear) {
  const w = document.createElement("div"); w.className = "mw"; const i = document.createElement("div"); i.className = "mi"; i.innerHTML = html; w.appendChild(i);
  msgs.appendChild(w); return { w, i, appear, h: 0 };
}
const items = [
  mk(`<div class="svc">Today</div>`),
  mk(`<div class="row out"><div class="bub">hi jane how are you doing?<i class="pad" style="width:84px"></i><span class="time"><span>4:44 PM</span>${I.check2}</span><div class="tail">${A.tailOut}</div></div></div>`),
  mk(`<div class="unread">Unread Messages</div>`),
  mk(`<div class="row in"><div class="bub" style="padding-bottom:8px">Hi Alex, long time no see! I'm good thanks for asking<div class="chip">${I.heart}<span class="av"></span></div><span class="time" style="bottom:6px"><span>5:31 PM</span></span></div></div>`),
  mk(`<div class="row in"><div class="bub">How about you?<i class="pad" style="width:58px"></i><span class="time"><span>5:32 PM</span></span><div class="tail">${A.tailIn}</div></div></div>`),
  mk(`<div class="row in"><div class="bub">Remember my dog I showed you a while ago? Can you send me that photo? 🐶<i class="pad" style="width:46px"></i><span class="time"><span>5:40 PM</span></span><div class="tail">${A.tailIn}</div></div></div>`, 0.7),
  mk(`<div class="row out"><div class="bub media"><div class="ph" id="sentPh" style="width:250px;height:250px;background:linear-gradient(135deg,#d4fc79,#96e6a1);font-size:120px">🐕</div><div class="tchip"><span>5:41 PM</span>${I.check2}</div><div class="tail">${A.tailOut}</div></div></div>`, 16.5),
];
items.forEach(it => { it.h = it.i.offsetHeight; });
items[4].i.querySelector(".tail").style.display = "block";
items[5].i.querySelector(".tail").style.display = "block";
items[6].i.querySelector(".tail").style.display = "block";
items[3].i.parentElement.style.display = "block";

function pushProgress(t) { return sys(seg(t, 3.5, 4.3)) - sys(seg(t, 15.8, 16.5)); }

function touch(t, list) {
  let o = 0, x = 0, y = 0, s = 1;
  for (const [a, tx, ty] of list) {
    const p = seg(t, a, a + 0.45);
    if (p > 0 && p < 1) { o = Math.sin(p * Math.PI) ** 0.5; x = tx; y = ty; s = 1 - 0.15 * Math.sin(p * Math.PI); }
  }
  const e = $("touch"); e.style.left = x + "px"; e.style.top = y + "px"; e.style.opacity = o * 0.9; e.style.transform = `scale(${s})`;
}

const QUERY = "Jane's dog";
function render(t) {
  const pp = pushProgress(t);
  const camTop = lerp(441, 0, sys(seg(t, 2.4, 3.2))) + (441 - 0) * 0 ;
  const camBack = sys(seg(t, 16.0, 16.8));
  const cam = lerp(camTop, 441, camBack);
  const S = 2.4;
  $("cam").style.transform = `translate(${(1080 - 402 * S) / 2}px, ${40 - cam * S}px) scale(${S})`;

  items.forEach(it => {
    if (it.appear === undefined) return;
    const p = sys(seg(t, it.appear, it.appear + 0.8));
    it.w.style.height = (it.h * p) + "px";
    it.i.style.opacity = clamp(p * 2.5);
    it.i.style.transform = `scale(${0.88 + 0.12 * p})`;
    it.i.style.transformOrigin = it === items[6] ? "right bottom" : "left bottom";
  });

  const chat = $("chat");
  chat.style.transform = `translateX(${-110 * pp}px)`;
  chat.style.filter = `brightness(${1 - 0.25 * pp})`;
  $("profile").style.transform = `translateX(${402 * (1 - pp)}px)`;
  $("profile").style.boxShadow = pp > 0 && pp < 1 ? "-10px 0 30px rgba(0,0,0,.15)" : "none";
  $("titlePill").style.transform = `translateX(-50%) scale(${t > 3.3 && t < 3.55 ? 0.95 : 1})`;

  const tabSel = sys(seg(t, 5.1, 5.7));
  const scrollP = sys(seg(t, 5.7, 6.9));
  const scroll = 413 * scrollP;
  const head = $("pHead");
  head.style.transform = `translateY(${-scroll}px)`;
  $("pGift").style.opacity = 1 - clamp(scrollP * 2.5);
  const expand = sys(seg(t, 5.8, 6.9));
  const pillW = lerp(itX[1][0] + itX[1][1] + 4, 370, expand);
  const pillStart = lerp(116, 16, expand);
  pill.style.left = pillStart + "px"; pill.style.width = pillW + "px";
  const sx = lerp(itX[0][0], itX[1][0], tabSel), sw = lerp(itX[0][1], itX[1][1], tabSel);
  const selEl = pill.querySelector(".sel"); selEl.style.left = sx + "px"; selEl.style.width = sw + "px";
  const pillY = 531 - scroll;
  pill.style.top = pillY + "px";
  pits.forEach((e, k) => { e.style.opacity = k <= 1 ? 1 : clamp((expand - 0.2) * 2); });

  const sBar = $("pSearch");
  const sp = sys(seg(t, 7.4, 8.2));
  sBar.style.top = (pillY + 40 + 8) + "px";
  sBar.style.opacity = sp; sBar.style.transform = `scaleY(${0.4 + 0.6 * sp}) scaleX(${0.9 + 0.1 * sp})`;
  const typed = Math.floor(seg(t, 9.2, 10.8) * QUERY.length + 0.0001);
  const focused = t > 8.8;
  const aiPulse = t > 11 && t < 12.3 ? 0.55 + 0.45 * Math.sin(t * 9) : 1;
  const sOpen = t > 12.2 ? "" : "";
  sBar.innerHTML = `${I.search(16).replace("<svg", '<svg style="color:#8e8e93"')}` + (typed > 0 ? `<span class="txt">${QUERY.slice(0, typed)}</span>` : `<span>Search media</span>`) +
    (focused && t < 10.9 && Math.floor(t * 2.2) % 2 === 0 ? `<span class="caret"></span>` : "") +
    `<span class="ai" style="opacity:${aiPulse}">${I.sparkle(13)}AI</span>`;
  const gridTop = pillY + 40 + 8 + 44 * sp - (1 - sp) * 0 + 4;
  const gridEl = $("pGrid");
  gridEl.style.top = gridTop + "px";
  gridEl.style.opacity = clamp((scrollP - 0.35) * 3);

  let gscroll = 0;
  if (t >= 6.4 && t < 7.2) gscroll = sys(seg(t, 6.4, 7.2)) * 1100;
  else if (t >= 7.2) gscroll = 1100 * (1 - io(seg(t, 7.2, 8.2)));
  const blur = t >= 6.4 && t < 8.2 ? Math.sin(seg(t, 6.4, 8.2) * Math.PI) * 3 : 0;
  const fade = sys(seg(t, 12.2, 13.0)), res = sys(seg(t, 12.5, 13.6));
  const skelAmt = seg(t, 11.0, 11.3) - seg(t, 12.2, 12.4);
  tiles.forEach(tl => {
    const b = cellPos(tl.i), f = cellPos(tl.dog ? tl.rank : tl.i);
    let x = b.x, y = b.y - gscroll, o = 1, s = 1;
    if (tl.dog) { x = lerp(b.x, f.x, res); y = lerp(b.y - gscroll, f.y, res); }
    else { o = 1 - fade; s = 1 - 0.2 * fade; }
    tl.el.style.transform = `translate(${x}px,${y}px) scale(${s})`;
    tl.el.style.opacity = o * (1 - clamp(skelAmt));
    tl.el.style.filter = blur > 0.05 ? `blur(${blur}px)` : "none";
  });
  skel.style.opacity = clamp(skelAmt); skel.style.display = skelAmt > 0 ? "block" : "none";
  skel.style.setProperty("--sx", (((t * 1.1) % 1) * 300 - 100) + "%");

  $("pTop").style.opacity = clamp(scrollP * 3);
  $("tpill").style.opacity = clamp((scrollP - 0.6) * 3);
  $("tpill").style.transform = `translateX(-50%) translateY(${(1 - clamp((scrollP - 0.6) * 3)) * 8}px)`;

  const vP = sys(seg(t, 14.1, 14.8)) - io(seg(t, 15.8, 16.3));
  const viewer = $("viewer");
  viewer.style.opacity = clamp(vP * 4);
  const vi = $("vImg"), first = cellPos(0), fp = clamp(vP), g0 = tiles[2].g;
  const fy = gridTop + first.y;
  vi.style.left = lerp(first.x + 2 * 134.67 * 0 + 2 * 134.67, 0, fp) + "px";
  vi.style.top = lerp(fy, 236, fp) + "px";
  vi.style.width = lerp(132.67, 402, fp) + "px"; vi.style.height = lerp(132.67, 402, fp) + "px";
  vi.style.fontSize = lerp(64, 190, fp) + "px";
  vi.style.background = `linear-gradient(135deg, ${g0[0]}, ${g0[1]})`; vi.textContent = "🐕";
  $("vClose").style.opacity = $("vMore").style.opacity = $("vShare").style.opacity = clamp((vP - 0.7) * 3.3);

  const sentBg = "linear-gradient(135deg,#d4fc79,#96e6a1)"; $("sentPh").style.background = sentBg;

  touch(t, [[3.3, 201, 84], [5.1, 236, 551], [8.7, 200, 232], [14.0, 330, 344], [15.7, 38, 812]]);
  $("status").style.color = vP > 0.5 ? "#fff" : "#000";
  $("status").style.filter = vP > 0.5 ? "invert(1)" : "none";
}
window.render = render;
render(0);
</script>
</body>
</html>
