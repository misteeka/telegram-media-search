<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1280px; height: 720px; overflow: hidden; font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #5bc0de 0%, #5b8fde 55%, #8e8bd6 100%); position: relative; }
#caption { position: absolute; left: 640px; top: 0; width: 560px; height: 720px; display: flex; flex-direction: column; justify-content: center; color: #fff; }
#caption .step { font-size: 15px; letter-spacing: 3px; text-transform: uppercase; opacity: .8; margin-bottom: 14px; }
#caption .title { font-size: 46px; font-weight: 700; line-height: 1.1; margin-bottom: 16px; }
#caption .sub { font-size: 21px; opacity: .92; line-height: 1.4; }
#phone { position: absolute; left: 150px; top: 20px; width: 354px; height: 680px; border-radius: 52px; background: #111; padding: 12px; box-shadow: 0 30px 60px rgba(0,0,0,.35); }
#screen { position: relative; width: 330px; height: 656px; border-radius: 42px; overflow: hidden; background: #a9c9d8; }
#island { position: absolute; left: 115px; top: 10px; width: 100px; height: 28px; border-radius: 14px; background: #000; z-index: 50; }
#status { position: absolute; top: 12px; left: 26px; font-size: 13px; font-weight: 700; z-index: 49; color: #000; }
#wall { position: absolute; inset: 0; background: radial-gradient(circle at 20% 20%, #cfe6d0 0, #9fc3a9 60%, #8fb69c 100%); }
#wall:after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.18) 2px, transparent 3px); background-size: 28px 28px; }
#head { position: absolute; top: 0; left: 0; right: 0; height: 96px; padding-top: 44px; background: rgba(245,247,250,.92); z-index: 10; }
#head .name { position: absolute; left: 0; right: 0; top: 46px; text-align: center; font-weight: 700; font-size: 15px; }
#head .name small { display: block; font-weight: 400; font-size: 11px; color: #3390ec; }
#head .back { position: absolute; left: 14px; top: 50px; font-size: 22px; color: #3390ec; }
#head .av { position: absolute; right: 14px; top: 48px; width: 34px; height: 34px; border-radius: 50%; background: #e8a96b; font-size: 20px; text-align: center; line-height: 34px; }
#searchBtn { position: absolute; right: 56px; top: 50px; width: 30px; height: 30px; border-radius: 50%; background: #e3eefb; text-align: center; line-height: 30px; font-size: 14px; }
#msgs { position: absolute; left: 0; right: 0; top: 96px; bottom: 60px; overflow: hidden; }
.bubble { position: absolute; max-width: 230px; padding: 7px 11px 6px; border-radius: 16px; font-size: 14px; line-height: 1.3; }
.in { background: #fff; left: 10px; border-bottom-left-radius: 5px; }
.out { background: #e1ffc7; right: 10px; border-bottom-right-radius: 5px; }
.bubble .t { font-size: 10px; opacity: .5; text-align: right; margin-top: 2px; }
.bubble .photo { width: 190px; height: 190px; border-radius: 10px; margin-bottom: 4px; display: flex; align-items: center; justify-content: center; font-size: 100px; }
#composer { position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: rgba(245,247,250,.95); z-index: 10; }
#composer .field { position: absolute; left: 44px; right: 44px; top: 10px; height: 36px; border-radius: 18px; background: #fff; border: 1px solid #dfe3e8; padding: 9px 14px; font-size: 14px; color: #999; }
#composer .clip { position: absolute; left: 14px; top: 16px; font-size: 18px; }
#composer .mic { position: absolute; right: 14px; top: 16px; font-size: 18px; }
#dim { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 20; }
#sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 560px; border-radius: 26px 26px 0 0; background: #f4f5f8; z-index: 30; overflow: hidden; box-shadow: 0 -8px 30px rgba(0,0,0,.2); }
#grab { position: absolute; left: 140px; top: 7px; width: 50px; height: 5px; border-radius: 3px; background: #c8cbd2; }
#sheetHead { position: absolute; top: 20px; left: 0; right: 0; height: 44px; text-align: center; font-weight: 700; font-size: 15px; line-height: 38px; }
#sheetHead .x { position: absolute; left: 12px; top: 0; width: 36px; height: 36px; border-radius: 50%; background: #fff; line-height: 36px; font-size: 15px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
#sbar { position: absolute; left: 12px; right: 12px; top: 70px; height: 38px; border-radius: 19px; background: #e5e7ec; padding: 0 12px; font-size: 15px; line-height: 38px; display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap; }
#sbar .ic { opacity: .5; font-size: 14px; }
#sbar .ai { margin-left: auto; font-size: 11px; font-weight: 700; color: #fff; background: linear-gradient(90deg, #3390ec, #9b5de5); padding: 3px 8px; border-radius: 10px; line-height: 14px; }
#caret { display: inline-block; width: 2px; height: 18px; background: #3390ec; vertical-align: middle; margin-left: 1px; }
#chips { position: absolute; left: 12px; top: 116px; height: 28px; display: flex; gap: 8px; }
.chip { padding: 0 12px; height: 28px; line-height: 28px; border-radius: 14px; background: #e5e7ec; font-size: 12px; font-weight: 600; color: #555; }
.chip.on { background: #3390ec; color: #fff; }
#info { position: absolute; left: 14px; right: 14px; top: 152px; height: 22px; font-size: 12px; color: #6b7280; }
#gridWrap { position: absolute; left: 0; right: 0; top: 176px; bottom: 0; overflow: hidden; }
.tile { position: absolute; width: 79px; height: 79px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 40px; overflow: hidden; will-change: transform; }
.tile .vid { position: absolute; left: 4px; bottom: 3px; font-size: 9px; color: #fff; background: rgba(0,0,0,.45); border-radius: 6px; padding: 1px 5px; }
#skel { position: absolute; left: 0; right: 0; top: 176px; bottom: 0; background: #f4f5f8; }
#skel .sk { position: absolute; border-radius: 6px; background: #e2e4ea; overflow: hidden; }
#skel .sk:after, .shim:after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.85) 50%, transparent 80%); transform: translateX(var(--sx, -100%)); }
#scan { position: absolute; left: 0; right: 0; top: 176px; height: 3px; background: linear-gradient(90deg, transparent, #3390ec, #9b5de5, transparent); }
#kb { position: absolute; left: 0; right: 0; bottom: 0; height: 232px; background: #d3d6dd; z-index: 40; padding: 8px 4px; }
#kb .row { display: flex; justify-content: center; gap: 5px; margin-bottom: 10px; }
#kb .k { width: 29px; height: 40px; border-radius: 6px; background: #fff; text-align: center; line-height: 40px; font-size: 17px; box-shadow: 0 1px 0 rgba(0,0,0,.3); }
#viewer { position: absolute; inset: 0; background: rgba(0,0,0,.92); z-index: 45; opacity: 0; }
#viewerImg { position: absolute; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
#vcap { position: absolute; left: 0; right: 0; bottom: 120px; text-align: center; color: #fff; font-size: 14px; }
#vcap b { display: block; font-size: 16px; margin-bottom: 4px; }
#send { position: absolute; left: 90px; right: 90px; bottom: 50px; height: 44px; border-radius: 22px; background: #3390ec; color: #fff; text-align: center; line-height: 44px; font-weight: 700; font-size: 15px; }
#tap { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: rgba(255,255,255,.55); border: 2px solid rgba(255,255,255,.9); z-index: 60; opacity: 0; box-shadow: 0 0 10px rgba(0,0,0,.25); }
#typing { position: absolute; left: 10px; top: 0; font-size: 12px; color: #fff; }
#sparkle { position: absolute; left: 0; right: 0; top: 182px; text-align: center; font-size: 13px; font-weight: 600; color: #3390ec; }
#cnt { position: absolute; left: 0; right: 0; top: 70px; text-align: center; }
</style>
</head>
<body>
<div id="caption"><div class="step"></div><div class="title"></div><div class="sub"></div></div>
<div id="phone"><div id="screen">
  <div id="island"></div><div id="status">9:41</div>
  <div id="wall"></div>
  <div id="head"><div class="back">‹</div><div class="name">Semyon<small>online</small></div><div id="searchBtn">🔍</div><div class="av">🧑</div></div>
  <div id="msgs"></div>
  <div id="composer"><div class="clip">📎</div><div class="field">Message</div><div class="mic">🎙️</div></div>
  <div id="dim"></div>
  <div id="sheet">
    <div id="grab"></div>
    <div id="sheetHead"><div class="x">✕</div>Search in chat</div>
    <div id="sbar"><span class="ic">🔍</span><span id="q"></span><span id="caretWrap"><span id="caret"></span></span><span class="ai">✦ AI</span></div>
    <div id="chips"><div class="chip on">Media</div><div class="chip">Files</div><div class="chip">Links</div><div class="chip">Voice</div></div>
    <div id="info"></div>
    <div id="gridWrap"></div>
    <div id="skel"></div>
    <div id="scan"></div>
    <div id="sparkle"></div>
  </div>
  <div id="kb"></div>
  <div id="viewer"><div id="viewerImg"></div><div id="vcap"></div><div id="send">Send</div></div>
  <div id="tap"></div>
</div></div>

<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const spring = p => { if (p >= 1) return 1; return 1 - Math.pow(1 - p, 3) * Math.cos(p * 5.2 * 0.85) * 0.999 + 0 * p; };
const out = p => 1 - Math.pow(1 - clamp(p), 4);
const inout = p => { p = clamp(p); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const lerp = (a, b, p) => a + (b - a) * p;
const $ = id => document.getElementById(id);

const grads = [["#f6d365", "#fda085"], ["#a1c4fd", "#c2e9fb"], ["#d4fc79", "#96e6a1"], ["#fbc2eb", "#a6c1ee"], ["#ffecd2", "#fcb69f"], ["#84fab0", "#8fd3f4"], ["#e0c3fc", "#8ec5fc"], ["#fddb92", "#d1fdff"]];
const others = ["🏔️", "🍕", "🌅", "🚗", "☕", "🎂", "🌳", "🏖️", "📄", "🍣", "🎸", "🏙️", "🐱", "🌸", "🧳", "🎮", "🚲", "🍔", "⛵", "📚", "🐦", "🛋️", "🎄", "🧁", "🐴"];
const dogs = ["🐕", "🐶", "🐩", "🦮", "🐕‍🦺", "🐶"];
const N = 72;
const tiles = [];
const dogIdx = [3, 9, 14, 22, 31, 47];
for (let i = 0; i < N; i++) {
  const d = dogIdx.indexOf(i);
  const g = grads[(i * 5 + 3) % grads.length];
  tiles.push({ i, dog: d >= 0, rank: d, emoji: d >= 0 ? dogs[d] : others[(i * 7 + 2) % others.length], g, vid: i % 11 === 4 });
}
const grid = $("gridWrap");
tiles.forEach(t => {
  const e = document.createElement("div");
  e.className = "tile";
  e.style.background = `linear-gradient(135deg, ${t.g[0]}, ${t.g[1]})`;
  e.innerHTML = t.emoji + (t.vid ? '<span class="vid">▶ 0:12</span>' : "");
  grid.appendChild(e);
  t.el = e;
});
const kb = $("kb");
["qwertyuiop", "asdfghjkl", "zxcvbnm"].forEach(r => {
  const row = document.createElement("div"); row.className = "row";
  row.innerHTML = [...r].map(c => `<div class="k">${c}</div>`).join("");
  kb.appendChild(row);
});
const skel = $("skel");
for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
  const s = document.createElement("div"); s.className = "sk";
  s.style.cssText = `left:${c * 82 + 1}px;top:${r * 82 + 6}px;width:79px;height:79px`;
  skel.appendChild(s);
}

const QUERY = "Semyon's dog";
const IN_Y = 0, G = 82;
const cellPos = (n) => ({ x: (n % 4) * G + 1, y: Math.floor(n / 4) * G + 6 });

const bubbles = [
  { side: "in", y: 8, text: "Hey! We're finally adopting 🥳", time: "14:02", at: -10 },
  { side: "out", y: 66, text: "No way, congrats!!", time: "14:03", at: -10 },
  { side: "in", y: 124, text: "Remember my dog I showed to you a while ago? Send me that photo, I can't find it 😅", time: "14:05", at: 0.6 },
];
const msgs = $("msgs");
bubbles.forEach(b => {
  const e = document.createElement("div");
  e.className = "bubble " + b.side;
  e.innerHTML = b.text + `<div class="t">${b.time}</div>`;
  msgs.appendChild(e); b.el = e;
});
const photoBubble = document.createElement("div");
photoBubble.className = "bubble out";
photoBubble.innerHTML = '<div class="photo" style="background:linear-gradient(135deg,#f6d365,#fda085)">🐕</div>Here he is!<div class="t">14:06 ✓✓</div>';
msgs.appendChild(photoBubble);

function setBubble(el, y, p) {
  el.style.top = y + "px";
  el.style.opacity = clamp(p * 3);
  el.style.transform = `translateY(${(1 - p) * 30}px) scale(${0.85 + 0.15 * p})`;
}

function caption(step, title, sub) {
  const c = $("caption");
  c.children[0].textContent = step; c.children[1].textContent = title; c.children[2].textContent = sub;
}

function render(t) {
  bubbles.forEach(b => setBubble(b.el, b.y, b.at < 0 ? 1 : spring(seg(t, b.at, b.at + 0.7))));

  const tapSeg = (a) => seg(t, a, a + 0.5);
  const tap = $("tap");
  let tapX = 0, tapY = 0, tapO = 0;
  const doTap = (a, x, y) => { const p = tapSeg(a); if (p > 0 && p < 1) { tapX = x; tapY = y; tapO = Math.sin(p * Math.PI); tap.style.transform = `scale(${0.6 + p * 0.9})`; } };
  doTap(2.2, 248, 66);
  doTap(10.2, 165, 250);
  doTap(12.1, 165, 616);
  tap.style.left = tapX + "px"; tap.style.top = tapY + "px"; tap.style.opacity = tapO;

  const sheetIn = out(seg(t, 2.7, 3.4));
  const sheetOut = inout(seg(t, 12.6, 13.2));
  const sheetP = sheetIn - sheetOut;
  $("sheet").style.transform = `translateY(${(1 - sheetP) * 580}px)`;
  $("dim").style.opacity = sheetP * 0.35;

  const kbP = out(seg(t, 3.6, 4.1)) - out(seg(t, 8.6, 9.1));
  kb.style.transform = `translateY(${(1 - kbP) * 240}px)`;
  const kbShown = kbP;

  const typed = Math.floor(clamp((t - 4.3) / 1.6) * QUERY.length + 0.0001);
  $("q").textContent = QUERY.slice(0, typed);
  $("caretWrap").style.opacity = (t > 3.6 && t < 9.2 && Math.floor(t * 2.5) % 2 === 0) || (t > 4.3 && t < 6.0) ? 1 : 0;
  $("caretWrap").style.display = t > 9.2 ? "none" : "inline";

  const phase = t < 6.4 ? "browse" : t < 8.2 ? "search" : "results";

  const gridTop = lerp(176, 176, 0);
  const shrink = kbShown * 232;
  $("gridWrap").style.bottom = shrink + "px";
  $("skel").style.bottom = shrink + "px";

  let scroll = 0;
  if (t >= 3.4 && t < 4.3) {
    const p = seg(t, 3.4, 4.3);
    scroll = out(p) * 520 * (p < 1 ? 1 : 0);
  }
  if (t >= 4.3) scroll = 520 * (1 - inout(seg(t, 4.3, 5.4)));
  const blur = t >= 3.4 && t < 4.6 ? Math.max(0, 1 - Math.abs(seg(t, 3.4, 4.6) - 0.2) * 1.2) * 2.5 : 0;

  const results = seg(t, 8.2, 9.0);
  const resultsPos = out(seg(t, 8.6, 9.6));
  tiles.forEach(tl => {
    const base = cellPos(tl.i);
    const fin = cellPos(tl.dog ? tl.rank : tl.i);
    let x = base.x, y = base.y - scroll, o = 1, s = 1;
    if (tl.dog) {
      x = lerp(base.x, fin.x, resultsPos);
      y = lerp(base.y - scroll, fin.y, resultsPos);
      const pulse = t >= 7.6 && t < 8.6 ? 1 + 0.06 * Math.sin(seg(t, 7.6, 8.6) * Math.PI) : 1;
      s = pulse;
    } else {
      o = 1 - out(results);
      s = 1 - 0.25 * out(results);
    }
    const isSearching = t >= 6.4 && t < 8.2;
    const hide = isSearching ? 1 : 0;
    const el = tl.el;
    el.style.transform = `translate(${x}px,${y}px) scale(${s})`;
    el.style.opacity = o * (1 - $skelAmt(t) * hide);
    el.style.filter = blur ? `blur(${blur}px)` : "none";
    if (t >= 9.9 && tl.dog && tl.rank === 0) el.style.boxShadow = "0 0 0 3px #3390ec";
    else el.style.boxShadow = "none";
  });

  function $skelAmt(t) { return seg(t, 6.4, 6.7) - seg(t, 8.0, 8.2); }
  const sk = $skelAmt(t);
  skel.style.opacity = sk;
  skel.style.display = sk > 0 ? "block" : "none";
  const sx = ((t * 1.1) % 1) * 300 - 100;
  document.documentElement.style.setProperty("--sx", sx + "%");

  const scan = $("scan");
  scan.style.opacity = sk;
  scan.style.transform = `translateY(${((t * 1.4) % 1) * 380}px)`;

  const sp = $("sparkle");
  sp.style.opacity = sk > 0 ? sk : 0;
  sp.style.top = "150px";
  sp.style.display = sk > 0 ? "block" : "none";
  sp.textContent = "✦ Understanding “" + QUERY + "”…";

  const info = $("info");
  if (t < 6.4) info.textContent = t < 4.3 ? "4,812 photos and videos" : "Searching in 4,812 photos and videos";
  else if (t < 8.2) info.textContent = "";
  else info.innerHTML = `<b style="color:#111">6 results</b> · matched “dog” + Semyon's face`;
  info.style.opacity = t >= 6.4 && t < 8.2 ? 0 : 1;

  const sheetHead = $("sheetHead");
  const mq = t > 6.4 ? 1 : 0;

  const vP = out(seg(t, 10.4, 11.0)) - out(seg(t, 12.2, 12.6));
  const viewer = $("viewer");
  viewer.style.opacity = clamp(vP);
  const vi = $("viewerImg");
  const first = cellPos(0);
  const sheetTopAbs = 656 - 560 + 176;
  const fx = first.x, fy = first.y + sheetTopAbs;
  const fp = clamp(vP);
  vi.style.left = lerp(fx, 15, fp) + "px";
  vi.style.top = lerp(fy, 130, fp) + "px";
  vi.style.width = lerp(79, 300, fp) + "px";
  vi.style.height = lerp(79, 300, fp) + "px";
  vi.style.fontSize = lerp(40, 160, fp) + "px";
  vi.style.background = `linear-gradient(135deg, ${grads[(3 * 5 + 3) % grads.length][0]}, ${grads[(3 * 5 + 3) % grads.length][1]})`;
  vi.textContent = "🐕";
  const vc = $("vcap"); vc.innerHTML = "<b>Semyon's dog · Rex</b>Mar 14, 2024 · in this chat";
  vc.style.opacity = clamp((vP - 0.6) * 2.5);
  $("send").style.opacity = clamp((vP - 0.6) * 2.5);
  $("send").style.transform = t > 12.1 && t < 12.3 ? "scale(.94)" : "scale(1)";

  const ph = spring(seg(t, 13.0, 13.8));
  setBubble(photoBubble, 276, t >= 13.0 ? ph : 0);
  photoBubble.style.display = t >= 12.9 ? "block" : "none";

  const sb = $("searchBtn");
  sb.style.transform = t > 2.2 && t < 2.8 ? "scale(1.2)" : "scale(1)";
  sb.style.background = t > 2.2 && t < 12.8 ? "#3390ec" : "#e3eefb";

  if (t < 2.2) caption("The problem", "Thousands of photos.", "One specific dog. Scrolling for it takes forever.");
  else if (t < 4.2) caption("Step 1", "Open media search", "A sheet slides up with every photo and video from this chat.");
  else if (t < 6.4) caption("Step 2", "Just describe it", "No dates, no albums. Type it the way you'd say it: “Semyon's dog”.");
  else if (t < 8.2) caption("Step 3", "AI understands the photos", "On-device recognition of objects, pets and faces, like the Apple Photos search.");
  else if (t < 10.2) caption("Step 4", "Only the dog remains", "Matches rise to the top, everything else fades away.");
  else if (t < 12.6) caption("Step 5", "Open it, send it", "Rex, found in seconds.");
  else caption("Done", "“There he is!”", "From a thousand photos to one tap.");
}
window.render = render;
render(0);
</script>
</body>
</html>
